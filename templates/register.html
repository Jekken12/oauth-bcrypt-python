{% extends "base.html" %}
{% block title %}Registro{% endblock %}
{% block content %}
  <form method="post" class="form">
    <label>
      Nombre
      <input type="text" name="name" placeholder="Nombre completo" required>
    </label>

    <label>
      Correo electrónico
      <input type="email" name="email" placeholder="usuario@correo.com" required>
    </label>

    <label>
      Contraseña
      <input type="password" name="password" placeholder="Mínimo 8 caracteres" minlength="8" required>
    </label>

    <label>
      Confirmar contraseña
      <input type="password" name="confirm_password" placeholder="Repite la contraseña" minlength="8" required>
    </label>

    <button class="primary" type="submit">Registrar usuario</button>
  </form>

  <p class="foot">
    ¿Ya tienes cuenta?
    <a href="{{ url_for('login') }}">Iniciar sesión</a>
  </p>
{% endblock %}
